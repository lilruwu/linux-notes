<!DOCTYPE html>
<html lang="es" class="v-paper t-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linux Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <!--
      Apply the saved appearance before the first paint so the app opens in its
      real theme instead of flashing the default light one while React boots.
      Mirrors the resolution logic in App.jsx (incl. "auto" → system preference).
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var s = JSON.parse(localStorage.getItem("linux-notes-settings") || "{}");
          var variant = s.variant || "paper";
          var theme = s.theme || "auto";
          if (theme === "auto") {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          d.className = "v-" + variant + " t-" + theme;
          if (s.fontSize) d.style.setProperty("--font-size", s.fontSize + "px");
        } catch (e) {
          /* fall back to the class hard-coded on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

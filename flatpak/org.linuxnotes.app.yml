# Flatpak manifest for Linux Notes.
# It installs a pre-built .deb into the GNOME runtime (which already provides
# webkit2gtk-4.1). Before building, place the built .deb next to this file as
# `linux-notes.deb` (the CI does this automatically). See README → Flatpak.
id: org.linuxnotes.app

runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk

command: linux-notes
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network # web fonts (Lora) load from the CDN, like the other builds

modules:
  - name: linux-notes
    buildsystem: simple
    sources:
      - type: file
        path: org.linuxnotes.app.metainfo.xml
      - type: file
        path: linux-notes.deb
    build-commands:
      - mkdir -p deb-extract
      - ar -x linux-notes.deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz
      - install -Dm755 deb-extract/usr/bin/linux-notes /app/bin/linux-notes
      - sed -i 's/^Icon=.*/Icon=org.linuxnotes.app/' "deb-extract/usr/share/applications/Linux Notes.desktop"
      - install -Dm644 "deb-extract/usr/share/applications/Linux Notes.desktop" /app/share/applications/org.linuxnotes.app.desktop
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/linux-notes.png /app/share/icons/hicolor/32x32/apps/org.linuxnotes.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/linux-notes.png /app/share/icons/hicolor/128x128/apps/org.linuxnotes.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/256x256@2/apps/linux-notes.png /app/share/icons/hicolor/256x256@2/apps/org.linuxnotes.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/512x512/apps/linux-notes.png /app/share/icons/hicolor/512x512/apps/org.linuxnotes.app.png
      - install -Dm644 org.linuxnotes.app.metainfo.xml /app/share/metainfo/org.linuxnotes.app.metainfo.xml
